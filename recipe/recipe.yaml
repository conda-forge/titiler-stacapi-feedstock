schema_version: 1

context:
  version: "2.1.0"
  python_min: "3.11"

package:
  name: titiler-stacapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/titiler-stacapi/titiler_stacapi-${{ version }}.tar.gz
  sha256: 3443f8fb9f884afa1f5928c2fb1b9bb8f4e65c6bbb55d8b4c70c332656599555

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - orjson
    - titiler-core >=2.0,<2.1
    - titiler-mosaic >=2.0,<2.1
    - titiler-extensions >=2.0,<2.1
    - pystac-client
    - pydantic >=2.4,<3.0
    - pydantic-settings >=2.0,<3.dev0

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - titiler.stacapi
      pip_check: true

about:
  summary: Connect titiler to STAC APIs.
  license: MIT
  license_file: LICENSE
  homepage: https://developmentseed.org/titiler-stacapi/
  repository: https://github.com/developmentseed/titiler-stacapi
  documentation: https://developmentseed.org/titiler-stacapi/

extra:
  recipe-maintainers:
    - martinRenou
